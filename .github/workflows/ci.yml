name: Staging validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Python dependencies and tests
        run: |
          pip install -r backend/requirements.txt
          python -m pytest -q
      - name: Build and test demo UI
        working-directory: frontend
        env: {VITE_DEMO: 'true'}
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Temporary staging stack
        run: |
          python scripts/configure.py
          docker compose build
          docker compose up -d --wait postgres
          sh scripts/migrate.sh
          docker compose up -d --wait
          python scripts/smoke.py
      - name: Verify monitoring configuration
        run: |
          docker compose --profile monitoring run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - name: Backup and restore rehearsal (synthetic)
        run: bash scripts/restore-drill.sh
      - name: Retain browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: frontend/playwright-report
          retention-days: 14
      - name: Clean up staging and generated credentials
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          rm -f .env
