name: Staging validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_BAKE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Python dependencies and tests
        run: |
          pip install -r backend/requirements.txt
          python -m pytest -q
      - name: Build and test demo UI
        working-directory: frontend
        env: { VITE_DEMO: 'true' }
        run: |
          set -o pipefail
          trap 'echo "::error::$(tail -n 12 /tmp/ui-check.log | tr "\n" " ")"' ERR
          npm ci 2>&1 | tee /tmp/ui-check.log
          npm audit --audit-level=high 2>&1 | tee /tmp/ui-check.log
          npm run build 2>&1 | tee /tmp/ui-check.log
          npx playwright install --with-deps chromium 2>&1 | tee /tmp/ui-check.log
          npx playwright test 2>&1 | tee /tmp/ui-check.log
      - name: Temporary staging stack
        run: |
          set -o pipefail
          trap 'echo "::error::$(tail -n 16 /tmp/staging-check.log | tr "\n" " ")"' ERR
          python scripts/configure.py 2>&1 | tee /tmp/staging-check.log
          docker compose build 2>&1 | tee /tmp/staging-check.log
          docker compose up -d --wait postgres 2>&1 | tee /tmp/staging-check.log
          sh scripts/migrate.sh 2>&1 | tee /tmp/staging-check.log
          docker compose up -d --wait 2>&1 | tee /tmp/staging-check.log
          python scripts/smoke.py 2>&1 | tee /tmp/staging-check.log
      - name: Verify monitoring configuration
        run: |
          docker compose --profile monitoring run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - name: Backup and restore rehearsal (synthetic)
        run: bash scripts/restore-drill.sh
      - name: Retain browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: frontend/playwright-report
          retention-days: 14
      - name: Clean up staging and generated credentials
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          rm -f .env
