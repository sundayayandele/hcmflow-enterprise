name: Publish GUI demo
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml', 'scripts/verify-pages.py']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build synthetic demo only
        working-directory: frontend
        env:
          VITE_DEMO: 'true'
          PAGES_BASE: /hcmflow-enterprise/
        run: npm ci && npm run build
      - name: Retain standalone demo for review
        uses: actions/upload-artifact@v4
        with:
          name: gui-demo-static
          path: frontend/dist
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published document and build assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify-pages.py
