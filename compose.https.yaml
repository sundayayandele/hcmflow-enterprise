services:
  edge:
    ports: !override ['80:80', '443:443']
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?Confirm target domain before HTTPS deployment}
    volumes: !override
      - ./deploy/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
